services:
  backend:
    image: "${IMAGE_REGISTRY:-local}/weather-backend:${IMAGE_TAG:-latest}"
    build:
      context: ./backend
    container_name: weather-backend
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      CLIENT_ORIGIN: "http://localhost:80,http://localhost:5173,http://localhost"
    restart: unless-stopped

  frontend:
    image: "${IMAGE_REGISTRY:-local}/weather-frontend:${IMAGE_TAG:-latest}"
    build:
      context: "./fronted/weather app"
      args:
        VITE_API_URL: "http://localhost:5000"
    container_name: weather-frontend
    depends_on:
      - backend
    ports:
      - "80:80"
    environment:
      VITE_API_URL: "http://localhost:5000"
    restart: unless-stopped
